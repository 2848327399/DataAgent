name: data-agent

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-saa_data_agent}
      MYSQL_USER: ${MYSQL_USER:-dataagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../data-agent-management/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../data-agent-management/src/main/resources/sql/data.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - database
    logging:
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: ..
      dockerfile: docker-file/Dockerfile-backend
    image: data-agent-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATA_AGENT_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-saa_data_agent}?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=${TZ:-Asia/Shanghai}
      DATA_AGENT_DATASOURCE_USERNAME: ${MYSQL_USER:-dataagent}
      DATA_AGENT_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DATA_AGENT_DATASOURCE_SQL_INIT: never
      DATAAGENT_SANDBOX_DOCKER_HOST: unix:///var/run/docker.sock
      DATAAGENT_SANDBOX_IMAGE: ${DATAAGENT_SANDBOX_IMAGE:-agentscope-registry.ap-southeast-1.cr.aliyuncs.com/agentscope/runtime-sandbox-base:latest}
      DATAAGENT_PYPI_INDEX_URL: ${DATAAGENT_PYPI_INDEX_URL:-https://pypi.org/simple}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backend_uploads:/app/uploads
      - backend_vectorstore:/app/vectorstore
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8065/echo/ok"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - edge
      - database
    logging:
      options:
        max-size: 20m
        max-file: "5"

  frontend:
    build:
      context: ..
      dockerfile: docker-file/Dockerfile-frontend
    image: data-agent-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql_data:
  backend_uploads:
  backend_vectorstore:

networks:
  edge:
  database:
    internal: true
